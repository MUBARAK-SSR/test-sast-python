name: Python SonarQube Analysis

on:
  push:
    branches:
      - main-dev
  pull_request:

jobs:
  sonar:
    name: SonarQube Scan (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest pytest-cov sqlalchemy alembic psycopg2-binary

      - name: Run tests with coverage
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=.

      - name: Run SonarQube Scanner
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=test-sast-python
            -Dsonar.host.url=http://35.92.216.5:9000
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
