[tool.poetry]
name = "sygalin_base_python"
version = "0.1.0"
description = "The base app for future SYGALIN SAS python projects"
authors = ["Harris TIWA <tiwa_m@sygalin.com>"] 
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,< 4.0"
fastapi = {extras = ["standard"], version = "^0.116.1"}
mangum = "^0.17.0"
pendulum = "^3.0.0"
pydantic = "^2.6.3"
PyJWT = "^2.8.0"
pyparsing = "^3.1.1"
python-dotenv = "^1.0.1"
uvicorn = "^0.27.1"
sqlalchemy = "^2.0.40"
alembic = "^1.15.2"
psycopg2-binary = "^2.9.10"
asyncpg = "^0.30.0"
httpx = "^0.28.1"
python-jose = "^3.3.0"
boto3 = "^1.38.13"
pytest = "^7.4"
pytest-asyncio = "^0.21.0"
python-multipart = "^0.0.20"
factory_boy = "^3.0"
fastapi-cache2 = "^0.2.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
#filterwarnings = [
#    "ignore::DeprecationWarning:botocore.auth"
#]
#asyncio_default_fixture_loop_scope = "function"
